services:
  - type: web
    name: merc-protocol
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: merc-protocol-db
          property: connectionString

databases:
  - name: merc-protocol-db
    plan: free
